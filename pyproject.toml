[project]
name = "qg-core"
version = "0.1.0"
description = "Language-agnostic Quality Gate engine"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1.0", "mypy>=1.7"]

[project.scripts]
qg = "qg_core.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP", "N", "ANN", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.setuptools.package-data]
qg_core = ["schemas/*.json", "scripts/*.sh"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
