# Optional companion to the quality gate — secret scanning.
#
# This is NOT part of the quality gate: the engine's `security` metric scans
# dependency advisories (npm/bundler/cargo audit), not committed secrets. This
# runs gitleaks as a separate required check.
#
# It uses the MIT-licensed gitleaks CLI directly instead of
# gitleaks/gitleaks-action@v2, which requires a PAID license for organization
# repos (fails every PR with "License key is required") — the CLI is free.
#
# Required branch-protection check (single workspace): `Security / secret-scan`.
name: Security
on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # `gitleaks dir` scans the checked-out tree, so shallow is fine. To scan
        # the PR's commit history instead (gitleaks git), set fetch-depth: 0.
        with: { fetch-depth: 1 }

      - name: Install gitleaks
        # shell: bash → `bash -o pipefail`, so a failed download fails the step.
        shell: bash
        env:
          # Pin and bump deliberately. Releases: https://github.com/gitleaks/gitleaks/releases
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        # Swap `dir .` for `git --log-opts=...` (with fetch-depth: 0 above) to
        # scan commit history. Add `--report-format sarif --report-path
        # results.sarif` + github/codeql-action/upload-sarif for the Security tab.
        run: gitleaks dir . --redact --no-banner
