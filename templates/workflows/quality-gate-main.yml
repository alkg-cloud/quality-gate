name: quality-gate-baseline
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-gate-main
  cancel-in-progress: false

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Setup stack
        run: ./.quality-gate/setup.sh

      - name: Install deps
        run: ./.quality-gate/install.sh

      - name: Run adapter
        run: ./.quality-gate/adapter.sh
        env:
          QG_OUTPUT_DIR: ${{ runner.temp }}/qg
          QG_MODE: main
          QG_CONFIG: ./quality-gate.config.json

      - name: Update baseline on orphan branch
        run: npx --yes @quality-gate/core@0.1.0 update-baseline --config ./quality-gate.config.json --output-dir ${{ runner.temp }}/qg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
