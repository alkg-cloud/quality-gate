name: quality-gate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: quality-gate-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Setup stack
        run: ./.quality-gate/setup.sh

      - name: Install deps
        run: ./.quality-gate/install.sh

      - name: Run adapter
        run: ./.quality-gate/adapter.sh
        env:
          QG_OUTPUT_DIR: ${{ runner.temp }}/qg
          QG_MODE: pr
          QG_CONFIG: ./quality-gate.config.json

      - name: Run quality gate
        run: npx --yes @quality-gate/core@0.1.0 pr --config ./quality-gate.config.json --output-dir ${{ runner.temp }}/qg

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-gate-marker-v1
          path: ${{ runner.temp }}/qg/pr-comment.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: ${{ runner.temp }}/qg
